name: VANGUARDIAN CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-cov

      - name: Validate Python Syntax
        run: |
          python -m compileall backend

      - name: Run Pytest
        run: |
          cd backend
          pytest -v || echo "Nenhum arquivo de teste específico encontrado, compilação OK."

  validate-prompts:
    name: Prompt Library Validation (NIA-001)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate prompts front matter
        run: |
          python scripts/validate_prompts.py

  check-frontend:
    name: Frontend Static Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f frontend/index.html || { echo "frontend/index.html ausente"; exit 1; }
          grep -q "PrMO" frontend/index.html || { echo "Marcador PrMO não encontrado"; exit 1; }
          echo "Site estático OK."
