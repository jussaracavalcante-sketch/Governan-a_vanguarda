services:
  - type: web
    name: vanguardian-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_NAME
        value: VANGUARDIAN API
      - key: DEBUG
        value: "False"
      - key: VERSION
        value: "1.0.0"
      # Banco de produção (Supabase) é infra externa — configure o valor real
      # no painel do Render (Environment). Ex.:
      # postgresql://postgres.<ref>:<SENHA>@aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      # Ver docs/SUPABASE.md. Fallback SQLite se não definido.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: ADMIN_EMAIL
        value: admin@vanguardian.local
      - key: ADMIN_PASSWORD
        value: admin123
