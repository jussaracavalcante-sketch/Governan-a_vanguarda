services:
  - type: web
    name: prmo-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_NAME
        value: PrMO API
      - key: DEBUG
        value: "False"
      - key: VERSION
        value: "1.0.0"
      # Banco de produção: Supabase/PostgreSQL (projeto prmo-governanca, ref
      # ubixfcoigwpjdrioymdq, região sa-east-1). A URL contém a SENHA do banco e
      # NÃO pode ser versionada (repo público) — por isso sync:false: informe o
      # valor real no painel do Render (Environment). Sem valor definido, o boot
      # falha de propósito para não cair silenciosamente no SQLite efêmero.
      # Formato (Session pooler, IPv4 — recomendado para o Render):
      # postgresql+psycopg2://postgres.ubixfcoigwpjdrioymdq:<SENHA>@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      # Passo a passo em docs/SUPABASE.md.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: ADMIN_EMAIL
        value: admin@vanguardian.com
      - key: ADMIN_PASSWORD
        value: admin123
