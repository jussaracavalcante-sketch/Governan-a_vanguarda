services:
  - type: web
    name: app-head-ia-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_NAME
        value: Gestão HEAD de IA API
      - key: DEBUG
        value: "False"
      - key: VERSION
        value: "1.0.0"
      # SQLite efêmero por padrão — deploy funciona out-of-the-box no free tier.
      # Para persistência, sobrescreva no painel do Render (Environment) com a
      # URL do Supabase/PostgreSQL:
      # postgresql://postgres.<ref>:<SENHA>@aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      # Ver docs/SUPABASE.md.
      - key: DATABASE_URL
        value: sqlite:///./head_ia.db
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Consulta ao PrMO (somente leitura). Preencha com a URL da API do PrMO.
      - key: PRMO_BASE_URL
        value: ""
      - key: ADMIN_EMAIL
        value: admin@headia.app
      - key: ADMIN_PASSWORD
        value: admin123
