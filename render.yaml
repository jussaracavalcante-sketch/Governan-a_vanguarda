services:
  - type: web
    name: app-head-ia-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_NAME
        value: Gestão HEAD de IA API
      - key: DEBUG
        value: "False"
      - key: VERSION
        value: "1.0.0"
      # Definido no painel do Render (Environment) — não versionado.
      # Cole a URL do Supabase/PostgreSQL (session pooler), ex.:
      # postgresql://postgres.<ref>:<SENHA-URL-ENCODED>@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      # Se ficar vazio, o backend usa SQLite efêmero (config.py). Ver docs/SUPABASE.md.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Consulta ao PrMO (somente leitura). Preencha com a URL da API do PrMO.
      - key: PRMO_BASE_URL
        value: ""
      - key: ADMIN_EMAIL
        value: jussara.cavalcante@vanguardamartech.com.br
      # Definido no painel do Render (Environment) — não versionado.
      - key: ADMIN_PASSWORD
        sync: false
      # Leitura AO VIVO do banco do PrMO (somente leitura) — definir no painel.
      # postgresql://head_reader.<ref>:<senha>@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: PRMO_DATABASE_URL
        sync: false
      # Senha do banco próprio do HEAD (persistência), se usada — definir no painel.
      - key: DB_PASSWORD
        sync: false
      # ─── Integração automática das atividades (definir no painel) ───
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: GOOGLE_SA_JSON
        sync: false
      - key: GOOGLE_IMPERSONATE_SUBJECT
        sync: false
      - key: GMAIL_QUERY
        sync: false

  # Sincronização automática das atividades (Jira/Drive/Gmail) 3x ao dia.
  # 11h, 17h e 23h UTC = 08h, 14h e 20h no horário de Brasília (BRT, UTC-3).
  - type: cron
    name: app-head-ia-sync
    env: python
    region: oregon
    plan: free
    schedule: "0 11,17,23 * * *"
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && python sync_activities.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: jussara.cavalcante@vanguardamartech.com.br
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: GOOGLE_SA_JSON
        sync: false
      - key: GOOGLE_IMPERSONATE_SUBJECT
        sync: false
      - key: GMAIL_QUERY
        sync: false
